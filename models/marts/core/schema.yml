version: 2

models:
  - name: dim_customers
    description: "Core dimensional model for customer entities with lifetime metrics."
    columns:
      - name: customer_id
        description: "Primary key for customer dimension."
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - not_null
      - name: customer_value_segment
        tests:
          - accepted_values:
              arguments:
                values: ['VIP / High Value', 'Repeat Customer', 'Single Buyer', 'Prospect / No Orders']

  - name: fct_order
    description: "Core fact model for customer orders and unit economics."
    columns:
      - name: order_id
        description: "Primary key for order fact."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key referencing dim_customers."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ['completed', 'returned', 'cancelled', 'pending']
      - name: total_amount_usd
        tests:
          - not_null

  - name: fct_daily_financial_kpis
    description: "Executive channel-level daily aggregation of financial, unit, and margin KPIs."
    columns:
      - name: order_date
        tests:
          - not_null
      - name: acquisition_channel
        tests:
          - not_null
      - name: gross_merchandise_value_usd
        tests:
          - not_null